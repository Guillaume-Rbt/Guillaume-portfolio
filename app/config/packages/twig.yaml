twig:
    file_name_pattern: '*.twig'
    form_themes: 
        - admin/form/visual_editor.html.twig
        - form/theme.html.twig
    globals:
        locales: '%app.locales%'
        uploads: '%uploads%'

when@dev:
    twig:
        cache: false

when@test:
    twig:
        strict_variables: true

